name: tiantianle-cloud-auto-update

on:
  workflow_dispatch:
  repository_dispatch:
    types: [tiantianle_manual_update]
  schedule:
    # 每 3 小時自動檢測：確認戰報是否為最新資料，並重建手機版同步檔案。
    - cron: "0 */3 * * *"
    # 台灣夏令開獎後嚴格更新窗：09:48-10:00，目標 10:00 前完成最新開獎與下期預測。
    - cron: "48 1 * * *"
    - cron: "49 1 * * *"
    - cron: "50 1 * * *"
    - cron: "52 1 * * *"
    - cron: "55 1 * * *"
    - cron: "58 1 * * *"
    - cron: "0 2 * * *"
    # 台灣夏令開獎後一小時保證更新窗：10:05-10:50 持續追最新資料與下期預測。
    - cron: "5 2 * * *"
    - cron: "10 2 * * *"
    - cron: "20 2 * * *"
    - cron: "30 2 * * *"
    - cron: "40 2 * * *"
    - cron: "50 2 * * *"
    # 台灣冬令開獎後嚴格更新窗：10:48-11:00。
    - cron: "48 2 * * *"
    - cron: "49 2 * * *"
    - cron: "55 2 * * *"
    - cron: "0 3 * * *"
    # 台灣冬令開獎後一小時保證更新窗：11:05-11:50 持續追最新資料與下期預測。
    - cron: "5 3 * * *"
    - cron: "10 3 * * *"
    - cron: "20 3 * * *"
    - cron: "30 3 * * *"
    - cron: "40 3 * * *"
    - cron: "50 3 * * *"
    # 台灣 13:00 強制完整重新運算、回測、檢討、戰報重建。
    - cron: "0 5 * * *"
    # 開獎後兩小時自動修復：夏令台灣 11:50 已含於上方，冬令台灣 12:50 另行補跑。
    - cron: "50 4 * * *"
    # 台灣 21:45 保險檢查。
    - cron: "45 13 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tiantianle-cloud-publisher
  cancel-in-progress: false

jobs:
  update:
    
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update draw data and recalculate all report modules
        run: python -u system_update.py
      - name: Validate current data, report sections and mobile synchronization
        run: python system_update.py --validate-only
      - name: Commit verified generated data
        run: |
          git config user.name 'tiantianle automation'
          git config user.email 'actions@users.noreply.github.com'
          git add data reports site fantasy5_full_history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified Tiantianle reports'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy verified report
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed report
        run: python verify_live_report.py
