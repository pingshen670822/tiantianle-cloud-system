name: tiantianle-cloud-auto-update

on:
  workflow_dispatch:
  workflow_call:
  repository_dispatch:
    types: [tiantianle_manual_update]
  schedule:
    - cron: '0 */3 * * *'
    - cron: '50,55 1 * * *'
    - cron: '0 2 * * *'
    - cron: '50,55 2 * * *'
    - cron: '0 3 * * *'
    - cron: '0 5 * * *'
    - cron: '45 13 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tiantianle-cloud-publisher
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONUTF8: '1'
      TIANTIANLE_RUN_MODE: ${{ github.event.schedule == '0 5 * * *' && 'deep' || 'realtime' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fault injection and regression tests
        run: python -m unittest discover -s tests -v
      - name: Calculate in isolation and promote verified output
        run: python -u system_update.py
      - name: Validate current report
        run: python system_update.py --validate-only
      - name: Commit verified generated data
        run: |
          git config user.name 'tiantianle automation'
          git config user.email 'actions@users.noreply.github.com'
          git add data reports site fantasy5_full_history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified Tiantianle reports'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy verified report
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed report
        run: python verify_live_report.py
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tiantianle-update-diagnostics
          path: |
            logs/last_update.log
            work/update_status.json
            reports/repair_validation.json
          if-no-files-found: ignore
