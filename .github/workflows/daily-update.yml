name: daily-tiantianle-update

"on":
  workflow_dispatch: {}
  schedule:
    # 每 3 小時自動檢測：確認戰報是否為最新資料，並重建手機版同步檔案。
    - cron: "0 */3 * * *"
    # 台灣夏令開獎後嚴格更新窗：09:48-10:00，目標 10:00 前完成最新開獎與下期預測。
    - cron: "48 1 * * *"
    - cron: "49 1 * * *"
    - cron: "50 1 * * *"
    - cron: "52 1 * * *"
    - cron: "55 1 * * *"
    - cron: "58 1 * * *"
    - cron: "0 2 * * *"
    # 台灣冬令開獎後嚴格更新窗：10:48-11:00。
    - cron: "48 2 * * *"
    - cron: "49 2 * * *"
    - cron: "50 2 * * *"
    - cron: "55 2 * * *"
    - cron: "0 3 * * *"
    # 台灣 13:00 強制完整重新運算、回測、檢討、戰報重建。
    - cron: "0 5 * * *"
    # 台灣 21:45 保險檢查。
    - cron: "45 13 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select automatic update mode
        shell: bash
        run: |
          if [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
            echo "TIANTIANLE_RUN_MODE=deep" >> "$GITHUB_ENV"
            echo "TIANTIANLE_CORE_BACKTEST_ROUNDS=120" >> "$GITHUB_ENV"
            echo "TIANTIANLE_PACK_GOVERNANCE_ROUNDS=80" >> "$GITHUB_ENV"
            echo "TIANTIANLE_PRECISION_TOURNAMENT_ROUNDS=120" >> "$GITHUB_ENV"
            echo "TIANTIANLE_INDUSTRIAL_BACKTEST_ROUNDS=120" >> "$GITHUB_ENV"
            echo "TIANTIANLE_ADVANCED_BACKTEST_ROUNDS=100" >> "$GITHUB_ENV"
            echo "TIANTIANLE_UNLIKELY_BACKTEST_ROUNDS=100" >> "$GITHUB_ENV"
            echo "TIANTIANLE_FORMULA_BACKTEST_ROUNDS=120" >> "$GITHUB_ENV"
            echo "TIANTIANLE_GROUP_BACKTEST_SHORT=60" >> "$GITHUB_ENV"
            echo "TIANTIANLE_GROUP_BACKTEST_MID=120" >> "$GITHUB_ENV"
            echo "TIANTIANLE_GROUP_BACKTEST_LONG=240" >> "$GITHUB_ENV"
            echo "13:00 Taiwan deep recalculation mode selected"
          else
            echo "TIANTIANLE_RUN_MODE=realtime" >> "$GITHUB_ENV"
            echo "TIANTIANLE_CORE_BACKTEST_ROUNDS=30" >> "$GITHUB_ENV"
            echo "TIANTIANLE_PACK_GOVERNANCE_ROUNDS=30" >> "$GITHUB_ENV"
            echo "TIANTIANLE_PRECISION_TOURNAMENT_ROUNDS=30" >> "$GITHUB_ENV"
            echo "TIANTIANLE_INDUSTRIAL_BACKTEST_ROUNDS=30" >> "$GITHUB_ENV"
            echo "TIANTIANLE_ADVANCED_BACKTEST_ROUNDS=30" >> "$GITHUB_ENV"
            echo "TIANTIANLE_UNLIKELY_BACKTEST_ROUNDS=30" >> "$GITHUB_ENV"
            echo "TIANTIANLE_FORMULA_BACKTEST_ROUNDS=30" >> "$GITHUB_ENV"
            echo "TIANTIANLE_GROUP_BACKTEST_SHORT=30" >> "$GITHUB_ENV"
            echo "TIANTIANLE_GROUP_BACKTEST_MID=60" >> "$GITHUB_ENV"
            echo "TIANTIANLE_GROUP_BACKTEST_LONG=120" >> "$GITHUB_ENV"
            echo "post-draw realtime update mode selected"
          fi
      - name: Update Tiantianle data and reports with post-draw retry
        shell: bash
        run: |
          set -e
          echo "mode=${TIANTIANLE_RUN_MODE}"
          for attempt in $(seq 1 10); do
            echo "post-draw update attempt ${attempt}/10"
            timeout 180 python "美國加州天天樂_20260618_第1版.py" || python offline_full_history_recalc.py
            python pages_build.py
            python sanitize_public_outputs.py
            python system_gap_audit.py --fail-on-critical --local-only
            if python - <<'PY'
          import json
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open("reports/latest_analysis.json", encoding="utf-8") as fh:
              analysis = json.load(fh)
          freshness = analysis.get("freshness") or {}
          latest = freshness.get("latest_draw_date") or (analysis.get("latest_draw") or {}).get("draw_date")
          target = analysis.get("target_draw_date")
          safe_text = freshness.get("target_taiwan_safe_update_time")
          now = datetime.now(ZoneInfo("Asia/Taipei"))
          if safe_text:
              safe_time = datetime.strptime(safe_text, "%Y-%m-%d %H:%M").replace(tzinfo=ZoneInfo("Asia/Taipei"))
              if now < safe_time:
                  seconds = (safe_time - now).total_seconds()
                  if seconds <= 300:
                      print(f"near safe update time; keep polling: now={now:%Y-%m-%d %H:%M}, safe={safe_text}")
                      sys.exit(1)
                  print(f"before safe update time: now={now:%Y-%m-%d %H:%M}, safe={safe_text}")
                  sys.exit(0)
          if not target or latest == target:
              print(f"latest draw reached target: latest={latest}, target={target}")
              sys.exit(0)
          print(f"latest source still old: latest={latest}, target={target}; retrying")
          sys.exit(1)
          PY
            then
              break
            fi
            if [ "$attempt" = "10" ]; then
              echo "latest draw still not available by the strict 10:00 window; 13:00 mandatory recalculation will retry and rebuild"
              break
            fi
            sleep 60
          done
      - name: Full system audit before publish
        shell: bash
        run: |
          set -e
          python -m py_compile \
            industrial_engine.py \
            tiantianle_formula_engine.py \
            tiantianle_core.py \
            pages_build.py \
            system_gap_audit.py \
            verify_mobile_sync.py \
            tiantianle_ironlaw_report.py \
            "美國加州天天樂_20260618_第1版.py"
          python - <<'PY'
          import csv
          import json
          import os
          import pathlib
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          root = pathlib.Path(".")
          required = [
              "fantasy5_full_history.csv",
              "data/california_fantasy5.csv",
              "data/fantasy5_full_history.csv",
              "reports/latest_analysis.json",
              "reports/latest_battle_report.html",
              "reports/prediction.html",
              "reports/review.html",
              "site/index.html",
              "site/latest_analysis.json",
              "site/reports/latest_battle_report.html",
          ]
          problems = []
          for item in required:
              if not (root / item).exists():
                  problems.append(f"\u7f3a\u5c11\u5fc5\u8981\u6a94\u6848\uff1a{item}")

          analysis_path = root / "reports/latest_analysis.json"
          site_analysis_path = root / "site/latest_analysis.json"
          analysis = {}
          site_analysis = {}
          if analysis_path.exists():
              analysis = json.loads(analysis_path.read_text(encoding="utf-8"))
          if site_analysis_path.exists():
              site_analysis = json.loads(site_analysis_path.read_text(encoding="utf-8"))

          latest = (analysis.get("latest_draw") or {}).get("draw_date") or (analysis.get("freshness") or {}).get("latest_draw_date")
          target = analysis.get("target_draw_date")
          site_latest = (site_analysis.get("latest_draw") or {}).get("draw_date") or (site_analysis.get("freshness") or {}).get("latest_draw_date")
          site_target = site_analysis.get("target_draw_date")
          engine = (analysis.get("industrial_engine") or {}).get("engine_version", "")
          top9 = [int(x) for x in (analysis.get("prediction") or {}).get("top9", [])]
          latest_nums = [int(x) for x in (analysis.get("latest_draw") or {}).get("numbers", [])]
          workflow_mode = os.environ.get("TIANTIANLE_RUN_MODE") or analysis.get("run_mode") or ""

          if not latest or not target:
              problems.append("\u6700\u65b0\u958b\u734e\u65e5\u671f\u6216\u4e0b\u671f\u9810\u6e2c\u65e5\u671f\u7a7a\u767d")
          if site_latest and latest and site_latest != latest:
              problems.append(f"\u624b\u6a5f\u8cc7\u6599\u8207\u4e3b\u8cc7\u6599\u4e0d\u540c\u6b65\uff1a\u4e3b\u8cc7\u6599 {latest}\uff0c\u624b\u6a5f {site_latest}")
          if site_target and target and site_target != target:
              problems.append(f"\u624b\u6a5f\u9810\u6e2c\u671f\u5225\u8207\u4e3b\u8cc7\u6599\u4e0d\u540c\u6b65\uff1a\u4e3b\u8cc7\u6599 {target}\uff0c\u624b\u6a5f {site_target}")
if not any(version in engine for version in ("industrial_v18", "industrial_v17", "industrial_v16", "industrial_v15")):
    problems.append(f"\u96f2\u7aef\u4e3b\u7a0b\u5f0f\u4e0d\u662f\u6700\u65b0\u7248\u9435\u5f8b\u5f15\u64ce\uff1a{engine}")
          if len(top9) != 9 or len(set(top9)) != 9 or any(n < 1 or n > 39 for n in top9):
              problems.append(f"\u524d\u4e5d\u9810\u6e2c\u683c\u5f0f\u932f\u8aa4\uff1a{top9}")
          repeated = sorted(set(top9) & set(latest_nums))
          if repeated and workflow_mode.lower() == "realtime":
              problems.append(f"\u5373\u6642\u6a21\u5f0f\u7981\u6b62\u4e0a\u671f\u865f\u78bc\u76f4\u63a5\u6df7\u5165\u524d\u4e5d\uff1a{repeated}")

          for csv_name in ["data/california_fantasy5.csv", "fantasy5_full_history.csv", "data/fantasy5_full_history.csv"]:
              csv_path = root / csv_name
              if not csv_path.exists():
                  continue
              with csv_path.open("r", encoding="utf-8-sig", newline="") as handle:
                  rows = list(csv.DictReader(handle))
              last_date = rows[-1].get("draw_date") if rows else ""
              if len(rows) < 10000:
                  problems.append(f"\u5168\u6b77\u53f2\u8cc7\u6599\u7b46\u6578\u4e0d\u8db3\uff1a{csv_name} \u53ea\u6709 {len(rows)} \u7b46")
              if latest and last_date != latest:
                  problems.append(f"\u5168\u6b77\u53f2\u8cc7\u6599\u672a\u66f4\u65b0\u5230\u6700\u65b0\u958b\u734e\uff1a{csv_name} \u6700\u5f8c\u65e5\u671f {last_date}\uff0c\u6700\u65b0 {latest}")

          label_unmarked = "\u672a\u6a19\u793a"
          label_missing = "\u672a\u53d6\u5f97"
          label_not_generated = "\u672a\u7522\u751f"
          label_pass = "\u901a\u904e"
          label_fail = "\u5931\u6557"
          phone_word = "\u624b\u6a5f"
          audit_lines = [
              "# \u5929\u5929\u6a02\u6bcf\u65e5\u81ea\u52d5\u66f4\u65b0\u7a3d\u6838",
              "",
              f"- \u7a3d\u6838\u6642\u9593\uff1a{datetime.now(ZoneInfo('Asia/Taipei')):%Y-%m-%d %H:%M:%S} \u53f0\u7063\u6642\u9593",
              f"- \u57f7\u884c\u6a21\u5f0f\uff1a{workflow_mode or label_unmarked}",
              f"- \u6700\u65b0\u958b\u734e\u65e5\u671f\uff1a{latest or label_missing}",
              f"- \u4e0b\u671f\u9810\u6e2c\u65e5\u671f\uff1a{target or label_missing}",
              f"- \u6700\u65b0\u5f15\u64ce\uff1a{engine or label_missing}",
              f"- \u524d\u4e5d\u9810\u6e2c\uff1a{' '.join(f'{n:02d}' for n in top9) if top9 else label_not_generated}",
              f"- \u624b\u6a5f\u540c\u6b65\uff1a{label_pass if not any(phone_word in p for p in problems) else label_fail}",
              f"- \u5168\u7cfb\u7d71\u6aa2\u67e5\uff1a{label_pass if not problems else label_fail}",
          ]
          if problems:
              audit_lines.append("")
              audit_lines.append("## \u5fc5\u9808\u4fee\u6b63")
              audit_lines.extend(f"- {problem}" for problem in problems)
          else:
              audit_lines.append("")
              audit_lines.append("## \u7d50\u8ad6")
              audit_lines.append("- \u767c\u5e03\u524d\u7a3d\u6838\u901a\u904e\uff0c\u5141\u8a31\u540c\u6b65\u5230\u624b\u6a5f\u96f2\u7aef\u7248\u3002")

          (root / "reports" / "auto_update_audit.md").write_text("\n".join(audit_lines) + "\n", encoding="utf-8")
          (root / "site" / "auto_update_audit.md").write_text("\n".join(audit_lines) + "\n", encoding="utf-8")
          if problems:
              print("\n".join(problems))
              sys.exit(1)
          PY
          python verify_mobile_sync.py --local-only
      - name: Commit updated data
        run: |
          git config user.name "tiantianle automation"
          git config user.email "actions@users.noreply.github.com"
          git add data reports site
          git diff --cached --quiet || git commit -m "Update Tiantianle data and reports"
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public mobile package
        shell: bash
        run: |
          set -e
          rm -rf public_site
          mkdir -p public_site/data public_site/reports
          cp -a site/. public_site/
          cp -a data/. public_site/data/
          cp -a reports/. public_site/reports/
          touch public_site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Fallback publish to gh-pages branch
        if: steps.deployment.outcome != 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "Official Pages deployment failed; using gh-pages branch fallback"
          publish_dir="$(mktemp -d)"
          cp -a public_site/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          cd "$publish_dir"
          git init
          git checkout -B gh-pages
          git config user.name "tiantianle automation"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Fallback publish Tiantianle mobile site"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
      - name: Confirm mobile deployment path
        shell: bash
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "Official GitHub Pages deployment succeeded"
          else
            echo "Fallback gh-pages branch deployment succeeded"
          fi
      - name: Verify deployed mobile sync
        shell: bash
        run: python verify_mobile_sync.py --remote --retries 12 --sleep 10
