name: tiantianle-cloud-self-heal

on:
  workflow_dispatch:
  workflow_run:
    workflows: [tiantianle-cloud-auto-update]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  retry-failed-update:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    uses: ./.github/workflows/tiantianle-cloud-auto-update.yml
