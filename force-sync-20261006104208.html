<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>天天樂手機強制同步</title>
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;background:#f6f7fb;color:#111827}main{max-width:680px;margin:auto;padding:28px}.box{background:#fff;border:1px solid #d8dee9;border-radius:8px;padding:18px}.status{font-weight:900;color:#166534}a{display:block;margin-top:14px;padding:14px;background:#166534;color:#fff;text-align:center;border-radius:8px;text-decoration:none;font-weight:900}</style>
    <style>
      .tiantianle-cloud-controls{position:sticky;top:0;z-index:9998;display:grid;grid-template-columns:auto minmax(150px,1fr) minmax(150px,1fr);gap:8px;align-items:center;padding:10px 12px;background:#fff7ed;border-bottom:3px solid #f97316;box-shadow:0 6px 18px rgba(15,23,42,.12);font-family:"Microsoft JhengHei",Arial,sans-serif}
      .tiantianle-cloud-title{font-weight:900;color:#7c2d12;white-space:nowrap}
      .tiantianle-cloud-button{display:block;text-align:center;border-radius:8px;padding:13px 12px;color:#fff!important;text-decoration:none;font-weight:900;border:0;line-height:1.2}
      .tiantianle-cloud-button.manual{background:#166534}
      .tiantianle-cloud-button.repair{background:#991b1b}
      .tiantianle-cloud-status{grid-column:1/-1;font-size:13px;color:#7c2d12;font-weight:800}
      @media(max-width:680px){.tiantianle-cloud-controls{grid-template-columns:1fr 1fr}.tiantianle-cloud-title,.tiantianle-cloud-status{grid-column:1/-1}.tiantianle-cloud-button{font-size:16px;padding:14px 8px}}
    </style>
    </head>
<body>
    <section id="tiantianleCloudControls" class="tiantianle-cloud-controls" aria-label="雲端操作">
      <div class="tiantianle-cloud-title">雲端快速操作</div>
      <a class="tiantianle-cloud-button manual" href="https://github.com/pingshen670822/tiantianle-cloud-system/actions/workflows/tiantianle-cloud-auto-update.yml" target="_blank" rel="noopener" onclick="tiantianlePrepareCloudAction('手動更新最新')">手動更新最新</a>
      <a class="tiantianle-cloud-button repair" href="https://github.com/pingshen670822/tiantianle-cloud-system/actions/workflows/tiantianle-cloud-self-heal.yml" target="_blank" rel="noopener" onclick="tiantianlePrepareCloudAction('當機立即修復')">當機立即修復</a>
      <div id="tiantianleCloudActionStatus" class="tiantianle-cloud-status">按鈕會開啟雲端工作流，同時手機會重抓最新資料</div>
    </section>
    <main><div class="box"><h1>天天樂手機強制同步</h1><p class="status" id="status">正在解除舊版手機快取控制</p><a href="prediction.html?v=20261006104208&manual=1">立即開啟最新預測</a></div></main>
<script>
(async function(){
  var VERSION = '20261006104208';
  var status = document.getElementById('status');
  function setStatus(text) { if (status) status.textContent = text; }
  async function clearEverything() {
    if ('serviceWorker' in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(async function(reg) {
        try {
          if (reg.active) reg.active.postMessage({ type: 'CLEAR_CACHE' });
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          await reg.update();
          await reg.unregister();
        } catch (err) {}
      }));
    }
    if ('caches' in window) {
      var keys = await caches.keys();
      await Promise.all(keys.map(function(key) { return caches.delete(key); }));
    }
  }
  try {
    await clearEverything();
    setStatus('舊快取已清除，正在重新拉取雲端');
    await fetch('service-worker.js?force=' + Date.now(), { cache: 'reload' }).catch(function(){});
    await fetch('version.json?force=' + Date.now(), { cache: 'no-store' }).catch(function(){});
    await fetch('prediction.html?force=' + Date.now(), { cache: 'no-store' }).catch(function(){});
  } catch (err) {
    setStatus('已啟動強制同步，正在進入最新版');
  }
  location.replace('prediction.html?v=' + VERSION + '&force_sync=' + Date.now());
})();
</script>
    <script>
    (function(){
      if (window.TIANTIANLE_OPEN_SYNC_VERSION === '20261006104208') return;
      window.TIANTIANLE_OPEN_SYNC_VERSION = '20261006104208';
      var firstOpenAt = Date.now();
      var normalCheckMs = 30000;
      var intenseWindowMs = 180000;
      function rootPrefix() {
        return decodeURIComponent(location.pathname).indexOf('/reports/') >= 0 ? '../' : '';
      }
      function currentStamp() {
        try {
          var queryStamp = new URL(location.href).searchParams.get('v') || '';
          return queryStamp || window.TIANTIANLE_BUILD_VERSION || window.TIANTIANLE_OPEN_SYNC_VERSION || '';
        } catch (err) {
          return window.TIANTIANLE_BUILD_VERSION || window.TIANTIANLE_OPEN_SYNC_VERSION || '';
        }
      }
      function stampFromPayload(data) {
        var raw = String((data && (data.version || data.generated_at_taiwan || data.generated_at)) || '');
        return raw.replace(/\D/g, '').slice(0, 14);
      }
      function setOpenSyncStatus(text) {
        var el = document.getElementById('mobileUpdateStatus');
        if (el) el.textContent = text;
      }
      async function clearAllBrowserCaches() {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(async function(reg) {
            try {
              if (reg.active) reg.active.postMessage({ type: 'CLEAR_CACHE' });
              await reg.update();
            } catch (err) {}
          }));
        }
        if ('caches' in window) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function(key) { return caches.delete(key); }));
        }
      }
      async function verifyLatestAnalysis(prefix) {
        try {
          var res = await fetch(prefix + 'latest_analysis.json?open=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) return null;
          return await res.json();
        } catch (err) {
          return null;
        }
      }
      async function mobileOpenSync() {
        var prefix = rootPrefix();
        try {
          var res = await fetch(prefix + 'version.json?open=' + Date.now(), {
            cache: 'no-store',
            headers: { 'Cache-Control': 'no-cache' }
          });
          if (!res.ok) return;
          var versionData = await res.json();
          var cloudStamp = stampFromPayload(versionData);
          var localStamp = String(currentStamp()).replace(/\D/g, '').slice(0, 14);
          if (cloudStamp && cloudStamp !== localStamp && !sessionStorage.getItem('tiantianle_open_synced_' + cloudStamp)) {
            sessionStorage.setItem('tiantianle_open_synced_' + cloudStamp, '1');
            setOpenSyncStatus('偵測到新戰報，正在自動切換最新版');
            await clearAllBrowserCaches();
            var target = new URL(location.href);
            target.searchParams.set('v', cloudStamp);
            target.searchParams.set('open_sync', Date.now());
            location.replace(target.toString());
            return;
          }
          var analysis = await verifyLatestAnalysis(prefix);
          if (analysis && analysis.generated_at_taiwan) {
            setOpenSyncStatus('手機已同步最新戰報：' + analysis.generated_at_taiwan);
          }
        } catch (err) {
          setOpenSyncStatus('手機同步檢查暫時失敗，會自動重試');
        }
      }
      window.addEventListener('pageshow', mobileOpenSync);
      window.addEventListener('online', mobileOpenSync);
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) mobileOpenSync();
      });
      setInterval(function() {
        mobileOpenSync();
      }, Date.now() - firstOpenAt < intenseWindowMs ? 10000 : normalCheckMs);
    })();
    </script>
    
    <script>
    window.TIANTIANLE_CLOUD_ACTION_VERSION = "20261006135027";
    async function tiantianleClearVisibleCaches() {
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(async function(reg) {
            try {
              if (reg.active) reg.active.postMessage({ type: 'CLEAR_CACHE' });
              await reg.update();
            } catch (err) {}
          }));
        }
        if ('caches' in window) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function(key) { return caches.delete(key); }));
        }
      } catch (err) {}
    }
    async function tiantianlePrepareCloudAction(label) {
      var status = document.getElementById('tiantianleCloudActionStatus');
      if (status) status.textContent = label + '：已清理手機快取，請在開啟的 GitHub 頁面按 Run workflow。';
      await tiantianleClearVisibleCaches();
      try {
        var prefix = location.pathname.indexOf('/reports/') >= 0 ? '../' : '';
        await fetch(prefix + 'latest_analysis.json?manual=' + Date.now(), { cache: 'no-store' });
        await fetch(prefix + 'version.json?manual=' + Date.now(), { cache: 'no-store' });
      } catch (err) {}
    }
    </script>
    </body></html>
